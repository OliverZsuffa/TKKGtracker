name: Discover TKKG audio sources

on:
  push:
    branches: [feat/009-shared-audio-catalogue]
    paths:
      - "scraper/audio_enrichment.py"
      - "requirements-audio.txt"
      - ".github/workflows/audio-enrichment.yml"
  schedule:
    - cron: "0 6 * * 2"
  workflow_dispatch:
    inputs:
      episode:
        description: "Specific episode number (leave empty to process missing mappings)"
        required: false
        type: string
        default: "150"
      limit:
        description: "Maximum number of episodes to process"
        required: true
        type: number
        default: 5
      write:
        description: "Write verified mappings to the central catalogue"
        required: true
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: tkkg-audio-enrichment-v3
  cancel-in-progress: false

jobs:
  discover:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
      - name: Install scraper and audio discovery dependencies
        run: |
          pip install -r requirements.txt
          pip install -r requirements-audio.txt
      - name: Discover and verify audio sources
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_EPISODE: ${{ inputs.episode }}
          INPUT_LIMIT: ${{ inputs.limit }}
          INPUT_WRITE: ${{ inputs.write }}
        run: |
          ARGS=(--limit "${INPUT_LIMIT:-5}")
          if [ "$EVENT_NAME" = "push" ]; then INPUT_EPISODE=150; fi
          if [ "$EVENT_NAME" = "schedule" ]; then INPUT_WRITE=true; fi
          if [ -n "${INPUT_EPISODE:-}" ]; then
            ARGS+=(--episode "$INPUT_EPISODE")
          fi
          if [ "$EVENT_NAME" = "schedule" ]; then
            ARGS+=(--latest-first)
          fi
          if [ "$INPUT_WRITE" = "true" ]; then
            ARGS+=(--write)
          fi
          python -m scraper.audio_enrichment "${ARGS[@]}"
      - name: Upload discovery report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: tkkg-audio-enrichment-report
          path: data/audio-enrichment-report.json
          if-no-files-found: warn
          retention-days: 30
      - name: Commit verified catalogue updates
        if: success() && (inputs.write == true || github.event_name == 'schedule')
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/episodes.json data/episodes.csv data/scrape-report.json
          if ! git diff --cached --quiet; then
            git commit -m "data: add verified TKKG audio sources"
            git push
          else
            echo "No verified audio mappings were added."
          fi
