name: Request 002 inspect missing official detail pages

on:
  push:
    branches:
      - request/002-fix-live-catalogue-refresh
    paths:
      - ".github/workflows/request-002-detail-page-inspection.yml"

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.ref }}
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Fetch verified official product pages
        run: |
          python - <<'PY'
          from pathlib import Path
          from bs4 import Tag
          from scraper.http import SourceClient

          urls = {
              222: "https://www.tkkg.de/produkte/details/roter-drache-222",
              223: "https://www.tkkg.de/produkte/details/betruger-super-sauber",
              234: "https://www.tkkg.de/produkte/details/im-auftrag-des-bosen",
          }
          client = SourceClient()
          Path("data/official-details").mkdir(parents=True, exist_ok=True)
          for number, url in urls.items():
              soup = client.get_html(url)
              Path(f"data/official-details/{number}.html").write_text(str(soup), encoding="utf-8")
              print(f"\nPAGE {number}: {url} ({len(str(soup))} characters)")
              for heading in soup.find_all(["h1", "h2", "h3", "h4", "h5", "h6"]):
                  label = " ".join(heading.get_text(" ", strip=True).split())
                  print(f"  HEADING {heading.name}: {label}")
                  if heading.name == "h5" and label.casefold() in {"inhalt", "sprecher", "details"}:
                      parent = heading.parent
                      print(f"    parent={parent.name} class={parent.get('class')!r}")
          PY
      - name: Upload detail-page HTML
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: request-002-missing-official-details
          path: data/official-details/*.html
          if-no-files-found: warn
          retention-days: 7
