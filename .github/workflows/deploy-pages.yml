name: Deploy TKKGTracker

on:
  push:
    branches: [main]
    paths-ignore:
      - "data/**"
      - "requests/**"
      - "docs/**"
      - "README.md"
      - ".github/copilot-instructions.md"
  workflow_dispatch:
  schedule:
    - cron: "0 7 * * 2"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: Validate TKKGData sync script
        run: node --check scripts/sync-catalogue.mjs
      - name: Fetch and validate the canonical TKKGData dataset
        run: npm run sync:data
      - run: npm install
      - run: npm audit --audit-level=high
      - run: npm run typecheck
      - run: npm test
      - name: Include canonical catalogue as a same-origin runtime resource
        run: mkdir -p public/data && cp data/episodes.json public/data/episodes.json
      - run: npm run build
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-24.04
    needs: build
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
